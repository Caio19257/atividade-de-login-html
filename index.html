<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        form {
            max-width: 800px;
            margin: 0 auto;
            padding: 30px;
            background-color: aqua;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(35, 0, 133, 0.6);
        }
        fieldset {
            margin-bottom: 25px;
            padding: 20px;
            border: 1px solid #d9e2ec;
            border-radius: 10px;
            background-color: #fafcff;
        }

        legend {
            padding: 6px 12px;

        }
    </style>
</head>
<body>
    <form action="#" method="post">
        <h1>Cadastro de Usuario</h1>
        <label for="nome">Nome Completo:<label>
        <input type="text" name="nome" id="nome" placeholder="Digite seu nome completo" required>
        <p>
        <Label for="nascimento">Data de Nascimento</Label>
        <input type="date" name="nascimento" id="nascimento" required>
        </p>   
        <label for="genêro">Genêro</label>
        <select name="genêro" id="genêro" required>
            <option value="Feminino">Feminino</option>
            <option value="Masculino">Masculino</option>
            <option value="Outro">Outro</option>
        </select>

        <label for="telefone">telefone:</label>
        <input type="tel" name="telefone" id="telefone" placeholder="(00) 00000-0000" required>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="exemplo@gmail.com" required>

        <label for="cidade">Cidade:</label>
        <input type="text" name="cidade" id="cidade" required>

        <label for="estado">Estado:</label>
        <select id="estado" name="estado" required>
        <option value="">Selecione...</option>
        <option value="AC">Acre</option>
        <option value="AL">Alagoas</option>
        <option value="AP">Amapá</option>
        <option value="AM">Amazonas</option>
        <option value="BA">Bahia</option>
        <option value="CE">Ceará</option>
        <option value="DF">Distrito Federal</option>
        <option value="ES">Espírito Santo</option>
        <option value="GO">Goiás</option>
        <option value="MA">Maranhão</option>
        <option value="MT">Mato Grosso</option>
        <option value="MS">Mato Grosso do Sul</option>
        <option value="MG">Minas Gerais</option>
        <option value="PA">Pará</option>
        <option value="PB">Paraíba</option>
        <option value="PR">Paraná</option>
        <option value="PE">Pernambuco</option>
        <option value="PI">Piauí</option>
        <option value="RJ">Rio de Janeiro</option>
        <option value="RN">Rio Grande do Norte</option>
        <option value="RS">Rio Grande do Sul</option>
        <option value="RO">Rondônia</option>
        <option value="RR">Roraima</option>
        <option value="SC">Santa Catarina</option>
        <option value="SP">São Paulo</option>
        <option value="SE">Sergipe</option>
        <option value="TO">Tocantins</option>
        </select>
    
        <a href="2 index.html"><button type="button">Enviar</button></a>
        <button type="reset">Limpar</button> 
    </form>
</body>
</html>
