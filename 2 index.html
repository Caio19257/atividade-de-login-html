<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agradecimento SENAI</title>
  <style>
    /* Centraliza o container no meio da tela */
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
      font-family: Arial, sans-serif;
    }

    /* Caixa retangular azul */
    .card {
      background-color: #000aeb; /* Tom de azul da imagem */
      width: 90%;
      max-width: 650px;
      padding: 60px 20px;
      border-radius: 4px;
      text-align: center;
      box-sizing: border-box;
    }

    /* Mensagem em caixa alta */
    .card h1 {
      color: #ffffff;
      font-size: 22px;
      font-weight: bold;
      margin: 0 0 25px 0;
      letter-spacing: 0.5px;
    }

    /* Botão que navega para outra página */
    .btn-sair {
      display: inline-block;
      background-color: #e2e5e9; /* Cor clara do botão */
      color: #6c757d; /* Cor do texto "Voltar" */
      text-decoration: none; /* Remove o sublinhado do link */
      padding: 10px 40px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: normal;
      transition: background-color 0.2s;
    }

    /* Efeito ao passar o mouse */
    .btn-sair:hover {
      background-color: #ffffff;
      color: #000aeb;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>O SENAI AGRADECE SUA INSCRIÇÃO!!!</h1>
    
    <!-- Altere 'index.html' para a página de destino que você desejar -->
    <a href="index.html" class="btn-sair">Voltar</a>
  </div>

</body>
</html>
